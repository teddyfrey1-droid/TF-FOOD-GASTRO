<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lafayette">
  <!-- Fond crème et vert cuisine : la palette de l'application, pour que
       l'icône de l'écran d'accueil et le premier écran se répondent. -->
  <rect width="512" height="512" rx="112" fill="#2f7d55"/>

  <!-- Bol vu de trois quarts : c'est un poké, pas un tableur. -->
  <path d="M104 232h304c0 92-68 152-152 152S104 324 104 232z" fill="#fdf8ef"/>
  <path d="M104 232h304" stroke="#fdf8ef" stroke-width="26" stroke-linecap="round"/>

  <!-- Garnitures, dans les couleurs des produits comptés. -->
  <circle cx="196" cy="196" r="34" fill="#f6b93b"/>
  <circle cx="268" cy="176" r="26" fill="#e4572e"/>
  <circle cx="330" cy="200" r="30" fill="#8fbf5f"/>
</svg>
